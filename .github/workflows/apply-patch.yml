name: Apply patch (one off, safe to delete)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply the patch
        run: |
          test -f patches/apply.diff
          git apply --verbose patches/apply.diff
          rm -f patches/apply.diff
      - name: Sanity check the fetcher still parses
        run: python3 -c "import ast; ast.parse(open('scripts/fetch.py').read()); print('fetch.py parses')"
      - name: Commit
        run: |
          git config user.name  "morning bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "fix the youtube view total, add what he shipped"
          git push
