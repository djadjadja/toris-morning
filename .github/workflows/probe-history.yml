name: Probe history (one off recon, safe to delete)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Go looking for a real year of history
        run: python scripts/probe_history.py
      - name: Commit the findings
        run: |
          git config user.name  "morning bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A probe
          git diff --staged --quiet || git commit -m "history probe results [skip ci]"
          git push
