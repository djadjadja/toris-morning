name: Morning numbers

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read the numbers
        run: python scripts/fetch.py
      - name: Save them
        run: |
          git config user.name  "morning bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "numbers for $(TZ=Asia/Kuala_Lumpur date +%F)"
          git push
