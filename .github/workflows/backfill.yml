name: Backfill (one off, deletes itself)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply the page patch
        run: |
          python3 -c "import base64,gzip;open('/tmp/apply.diff','wb').write(gzip.decompress(base64.b64decode(''.join(open('patches/patch.b64').read().split()))))"
          git apply --verbose /tmp/apply.diff

      - name: Fold in the Spotify for Artists export
        run: python3 scripts/backfill.py

      - name: Sanity check
        run: |
          python3 -c "import ast;ast.parse(open('scripts/fetch.py').read());print('fetch.py parses')"
          python3 -c "import json;d=json.load(open('data.json'));assert len(d['days'])>900,len(d['days']);assert d['days'][0]['date']=='2024-01-01';print(len(d['days']),'days',d['days'][0]['date'],'to',d['days'][-1]['date'])"

      - name: Tidy up and commit
        run: |
          rm -rf patches probe/history
          rm -f scripts/backfill.py scripts/probe_history.py
          rm -f .github/workflows/probe-history.yml .github/workflows/apply-patch.yml
          rm -f .github/workflows/backfill.yml
          git config user.name  "morning bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "956 real days from Spotify for Artists, a range picker, and a cumulative plays line"
          git push
