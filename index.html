<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F6F2F7" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="This Morning" />
<title>This Morning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,200;9..144,300;9..144,500&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#241D33; --muted:#6E6482; --faint:#A39AB0;
    --accent:#3E6B70; --hair:#E0D8E6; --card:#FCFAFD;
  }
  *{box-sizing:border-box}
  html,body{min-height:100%}
  body{
    margin:0; color:var(--ink);
    background:
      radial-gradient(120% 70% at 50% -10%, #FBF3EC 0%, rgba(251,243,236,0) 60%),
      linear-gradient(#F7F3F8 0%, #EFE9F2 100%);
    background-attachment:fixed;
    font-family:Karla,ui-sans-serif,system-ui,sans-serif;
    padding:calc(34px + env(safe-area-inset-top)) 20px calc(56px + env(safe-area-inset-bottom));
    display:flex; justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  .sheet{width:100%;max-width:460px}

  .eyebrow{
    font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--faint);font-weight:700;
  }
  .greet{
    font-family:Fraunces,Georgia,serif;font-weight:200;font-style:italic;
    font-size:19px;color:var(--muted);margin:6px 0 22px;
  }

  h1{
    font-family:Fraunces,Georgia,serif;font-weight:300;
    font-size:clamp(28px,7.6vw,37px);line-height:1.2;
    letter-spacing:-.018em;margin:0;
  }
  h1.quiet{color:var(--muted);font-size:clamp(24px,6.4vw,30px)}
  .word{display:inline-block;opacity:0;animation:rise .7s cubic-bezier(.2,.7,.3,1) forwards}
  @keyframes rise{from{opacity:0;transform:translateY(.4em)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.word{animation:none;opacity:1}}

  /* the headline number */
  .headline{margin:34px 0 4px}
  .headline .n{
    font-family:Fraunces,Georgia,serif;font-weight:300;
    font-size:clamp(52px,15vw,70px);line-height:.95;letter-spacing:-.03em;
    font-variant-numeric:tabular-nums;display:block;
  }
  .headline .cap{
    font-size:11px;letter-spacing:.15em;text-transform:uppercase;
    color:var(--faint);font-weight:700;margin-top:12px;display:block;
  }
  .spark{display:block;width:100%;height:44px;margin-top:18px;overflow:visible}

  .rule{height:1px;background:var(--hair);margin:30px 0 4px}
  .row{
    display:flex;justify-content:space-between;align-items:baseline;
    gap:14px;padding:14px 0;border-bottom:1px solid var(--hair);
  }
  .row:last-child{border-bottom:none}
  .row .label{font-size:13.5px;color:var(--muted)}
  .row .right{display:flex;align-items:baseline;gap:9px}
  .row .val{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
  .row .val.none{color:var(--faint);font-weight:400}
  .chip{
    font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;
    color:var(--accent);background:rgba(62,107,112,.09);
    padding:3px 7px;border-radius:999px;white-space:nowrap;
  }
  .chip.down{color:var(--faint);background:rgba(110,100,130,.08)}

  .cumulative{margin-top:24px;font-size:14.5px;line-height:1.6;color:var(--muted)}
  .cumulative strong{color:var(--accent);font-weight:700}

  .rest{
    margin-top:32px;padding:26px 24px;background:var(--card);
    border:1px solid var(--hair);border-radius:4px;
    box-shadow:0 1px 2px rgba(36,29,51,.03),0 10px 26px -18px rgba(36,29,51,.28);
    font-family:Fraunces,Georgia,serif;font-size:17.5px;line-height:1.5;font-weight:300;
    position:relative;
  }
  .rest:before{
    content:"";position:absolute;left:24px;top:-1px;width:34px;height:2px;background:var(--accent);
  }

  .footer{margin-top:28px}
  .status{font-size:12px;color:var(--faint);display:block;margin-bottom:12px;line-height:1.5}
  button.link{
    background:none;border:none;padding:0;font-family:inherit;font-size:12.5px;
    color:var(--accent);cursor:pointer;border-bottom:1px solid rgba(62,107,112,.3);
  }
  .panel{
    margin-top:20px;padding:20px;background:var(--card);
    border:1px solid var(--hair);border-radius:4px;
  }
  .panel[hidden]{display:none}
  .note{font-size:12.5px;color:var(--faint);line-height:1.55;margin-bottom:18px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:11px;letter-spacing:.06em;color:var(--muted);margin-bottom:6px;text-transform:uppercase;font-weight:600}
  .field input{
    width:100%;padding:11px 13px;border:1px solid var(--hair);border-radius:3px;
    background:#fff;font-family:inherit;font-size:16px;color:var(--ink);
  }
  button.primary{
    margin-top:8px;width:100%;padding:13px;background:var(--ink);color:#F7F3F8;
    border:none;border-radius:3px;font-family:inherit;font-size:14px;font-weight:700;
    letter-spacing:.02em;cursor:pointer;
  }
  .sig{margin-top:38px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
  input:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="sheet">
  <div class="eyebrow" id="date">&nbsp;</div>
  <div class="greet" id="greet">Good morning, Tori</div>

  <h1 id="hero">Opening the morning</h1>

  <div class="headline" id="headline" hidden>
    <span class="n" id="headlineN"></span>
    <span class="cap" id="headlineCap"></span>
    <svg class="spark" id="spark" hidden preserveAspectRatio="none"></svg>
  </div>

  <div class="rule"></div>
  <div id="rows"></div>
  <div class="cumulative" id="cumulative" hidden></div>
  <div class="rest" id="rest"></div>

  <div class="footer">
    <span class="status" id="status"></span>
    <button class="link" id="btnManual">Type numbers in</button>
  </div>

  <div class="panel" id="manual" hidden>
    <div class="note">YouTube and Spotify fill themselves in four times a day. Instagram and Apple do not publish theirs to anyone but you, so those come from the emails you already get. Anything typed here wins.</div>
    <div id="manualFields"></div>
    <button class="primary" id="saveManual">Save today's numbers</button>
  </div>

  <div class="sig" id="sig">&nbsp;</div>
</div>

<script>
/* Note for future edits: do NOT name a global `history`.
   window.history is not writable, the assignment silently fails and the
   whole page dies before first render. Cost us a morning on 2026-08-15. */

var HIST_KEY = 'tori-morning-history';

var METRICS = [
  { key:'spotifyListeners', label:'Spotify monthly listeners', headline:true },
  { key:'spotifyFollowers', label:'Spotify followers' },
  { key:'youtubeSubs',      label:'YouTube subscribers' },
  { key:'youtubeViews',     label:'YouTube views, all time' },
  { key:'instagram',        label:'Instagram followers' },
  { key:'apple',            label:'Apple Music listeners' }
];

var REST_LINES = [
  "You've done enough today. That's not a reward, it's just true.",
  "None of this needed you awake for it. Take the morning slow.",
  "The catalogue works while you rest. That was the whole point of building it.",
  "Rest isn't the thing you get after. It's part of how this keeps going.",
  "You are allowed to close this and do nothing with the information.",
  "Whatever you don't get to today will still be there, and it will still be fine.",
  "You built something that keeps moving without you. Go and enjoy that."
];

var days = [];
var draft = {};

function load(k){ try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch(e){ return null; } }
function stash(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }

function todayKey(){
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function n(v){ return (typeof v === 'number' && !isNaN(v)) ? v : 0; }
function fmt(v){ return (typeof v === 'number' && !isNaN(v)) ? v.toLocaleString() : null; }

function heroSentence(t, y){
  if (!y) return { line:"This is the starting line. From tomorrow this page tells you what moved while you slept.", quiet:true };
  var dL = n(t.spotifyListeners) - n(y.spotifyListeners);
  var dF = n(t.spotifyFollowers) - n(y.spotifyFollowers);
  var dS = n(t.youtubeSubs)      - n(y.youtubeSubs);
  var dI = n(t.instagram)        - n(y.instagram);
  var dV = n(t.youtubeViews)     - n(y.youtubeViews);
  if (dL > 0) return { line:'While you slept, ' + fmt(dL) + ' more people found his music.' };
  if (dS > 0) return { line:fmt(dS) + ' people subscribed while you were off the clock.' };
  if (dF > 0) return { line:fmt(dF) + ' people followed him overnight.' };
  if (dI > 0) return { line:fmt(dI) + ' new people started following overnight.' };
  if (dV > 0) return { line:'His music played ' + fmt(dV) + ' more times, without anyone asking you to do a thing.' };
  if (dL < 0) return { line:"The number dipped a little overnight. It does that. The catalogue is still out there working.", quiet:true };
  return { line:"Nothing moved much overnight. What you built is still sitting there, doing its job.", quiet:true };
}

function greeting(){
  var h = new Date().getHours();
  if (h < 5)  return 'Still up, Tori';
  if (h < 12) return 'Good morning, Tori';
  if (h < 18) return 'Afternoon, Tori';
  return 'Evening, Tori';
}

function sparkline(series){
  var svg = document.getElementById('spark');
  if (series.length < 3){ svg.hidden = true; return; }
  svg.hidden = false;
  var W = 300, H = 44, lo = Math.min.apply(null, series), hi = Math.max.apply(null, series);
  var span = (hi - lo) || 1;
  var pts = series.map(function(v,i){
    var x = (i/(series.length-1))*W;
    var y = H - 4 - ((v-lo)/span)*(H-10);
    return x.toFixed(1)+','+y.toFixed(1);
  });
  var last = pts[pts.length-1].split(',');
  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  svg.innerHTML =
    '<polyline points="'+pts.join(' ')+'" fill="none" stroke="#3E6B70" stroke-width="1.5" '+
    'stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>' +
    '<circle cx="'+last[0]+'" cy="'+last[1]+'" r="2.8" fill="#3E6B70"/>';
}

function render(){
  var tk = todayKey();
  var today = days.filter(function(d){ return d.date === tk; })[0] || {};
  var past  = days.filter(function(d){ return d.date !== tk; });
  var yest  = past.length ? past[past.length-1] : null;
  var first = days.length ? days[0] : null;

  document.getElementById('date').textContent =
    new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});
  document.getElementById('greet').textContent = greeting();

  var hero = heroSentence(today, yest);
  var h1 = document.getElementById('hero');
  h1.className = hero.quiet ? 'quiet' : '';
  h1.innerHTML = '';
  hero.line.split(' ').forEach(function(w,i){
    var s = document.createElement('span');
    s.className = 'word';
    s.style.animationDelay = (i*50) + 'ms';
    s.textContent = w + ' ';
    h1.appendChild(s);
  });

  // headline number
  var hv = today.spotifyListeners;
  var box = document.getElementById('headline');
  if (typeof hv === 'number'){
    box.hidden = false;
    document.getElementById('headlineN').textContent = fmt(hv);
    document.getElementById('headlineCap').textContent = 'people listening this month';
    var series = days.map(function(d){ return d.spotifyListeners; })
                     .filter(function(v){ return typeof v === 'number'; }).slice(-30);
    sparkline(series);
  } else { box.hidden = true; }

  var rows = document.getElementById('rows');
  rows.innerHTML = '';
  METRICS.forEach(function(m){
    var now = today[m.key], then = yest ? yest[m.key] : undefined;
    var d = (typeof now === 'number' && typeof then === 'number') ? now - then : null;
    var el = document.createElement('div');
    el.className = 'row';
    var shown = fmt(now);
    var right = shown
      ? '<span class="val">' + shown + '</span>'
      : '<span class="val none">not in yet</span>';
    if (d !== null && d !== 0){
      right += '<span class="chip' + (d<0?' down':'') + '">' +
               (d>0?'+':'\u2212') + ' ' + fmt(Math.abs(d)) + '</span>';
    }
    el.innerHTML = '<div class="label">'+m.label+'</div><div class="right">'+right+'</div>';
    rows.appendChild(el);
  });

  var cum = document.getElementById('cumulative');
  cum.hidden = true;
  if (first && first.date !== tk && typeof today.spotifyListeners === 'number'
      && typeof first.spotifyListeners === 'number'){
    var diff = today.spotifyListeners - first.spotifyListeners;
    if (diff !== 0){
      cum.hidden = false;
      cum.innerHTML = 'Since this page started keeping count, monthly listeners are <strong>' +
        (diff>0?'up ':'down ') + fmt(Math.abs(diff)) + '</strong>.';
    }
  }

  document.getElementById('rest').textContent = REST_LINES[new Date().getDate() % REST_LINES.length];
  document.getElementById('sig').textContent =
    days.length > 1 ? days.length + ' mornings recorded' : 'First morning';
}

function buildFields(){
  var mf = document.getElementById('manualFields');
  mf.innerHTML = '';
  var tk = todayKey();
  var today = days.filter(function(d){ return d.date === tk; })[0] || {};
  METRICS.forEach(function(m){
    var wrap = document.createElement('div');
    wrap.className = 'field';
    wrap.innerHTML = '<label for="f_'+m.key+'">'+m.label+'</label>' +
      '<input id="f_'+m.key+'" inputmode="numeric" placeholder="'+(fmt(today[m.key])||'')+'">';
    mf.appendChild(wrap);
    wrap.querySelector('input').addEventListener('input', function(e){ draft[m.key] = e.target.value; });
  });
}

function record(values){
  var tk = todayKey();
  var prior = days.filter(function(d){ return d.date === tk; })[0] || {};
  var merged = Object.assign({}, prior, values, { date: tk });
  days = days.filter(function(d){ return d.date !== tk; }).concat([merged])
             .sort(function(a,b){ return a.date < b.date ? -1 : 1; });
  stash(HIST_KEY, days);
  render();
}

(function boot(){
  days = load(HIST_KEY) || [];
  render();
  buildFields();

  document.getElementById('btnManual').addEventListener('click', function(){
    var p = document.getElementById('manual');
    p.hidden = !p.hidden;
    this.textContent = p.hidden ? 'Type numbers in' : 'Hide';
    if (!p.hidden) buildFields();
  });
  document.getElementById('saveManual').addEventListener('click', function(){
    var vals = {};
    Object.keys(draft).forEach(function(k){
      var v = parseInt(String(draft[k]).replace(/[^0-9]/g,''),10);
      if (!isNaN(v)) vals[k] = v;
    });
    if (Object.keys(vals).length) record(vals);
    draft = {};
    document.getElementById('manual').hidden = true;
    document.getElementById('btnManual').textContent = 'Type numbers in';
    document.getElementById('status').textContent = "Saved. That's today on the record.";
  });

  fetch('./data.json?t=' + Date.now(), { cache:'no-store' })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(feed){
      if (!Array.isArray(feed) || !feed.length) return;
      var byDate = {};
      feed.concat(days).forEach(function(e){
        if (e && e.date) byDate[e.date] = Object.assign({}, byDate[e.date], e);
      });
      days = Object.keys(byDate).sort().map(function(k){ return byDate[k]; });
      stash(HIST_KEY, days);
      render();
      buildFields();
    })
    .catch(function(){
      document.getElementById('status').textContent =
        "Couldn't reach this morning's numbers. Everything below is the last set that came through.";
    });
})();
</script>
</body>
</html>
